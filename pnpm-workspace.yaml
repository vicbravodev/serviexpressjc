# pnpm ≥10 bloquea postinstall scripts no aprobados; estos tres son requeridos por Next.js
# (compilador SWC, optimización de imágenes sharp y watcher de archivos en dev).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true

# Dependencias internas de next con avisos (build-time / optimizador self-hosted). Ver pnpm audit.
overrides:
  postcss: ^8.5.23
  sharp: ^0.35.5
  nanoid@3: ^3.3.18
  source-map-js: ^1.2.2
